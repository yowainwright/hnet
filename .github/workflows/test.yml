name: Test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ${{ vars.HNET_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    env:
      MISE_DATA_DIR: ${{ runner.temp }}/hnet-mise-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install project tools
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          version: 2026.9.0
          cache: false

      - name: Install Linux system packages
        if: runner.os == 'Linux'
        run: mise bootstrap --only packages --update --yes

      - name: Run lint
        run: ./ops/scripts/lint.sh --strict

      - name: Run tests
        shell: bash
        run: |
          find tests -type f -name '*_test.sh' -print0 |
            while IFS= read -r -d '' test_file; do
              "$test_file" || exit "$?"
            done

      - name: Validate central Compose configuration
        run: |
          docker compose \
            --env-file ops/telemetry/.env.mac-studio.example \
            -f ops/telemetry/compose.mac-studio.yml \
            config --quiet

      - name: Validate edge Compose configuration
        run: |
          docker compose \
            --env-file ops/telemetry/.env.edge.example \
            -f ops/telemetry/compose.edge.yml \
            config --quiet
