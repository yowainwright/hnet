name: Test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Isolate project tool data
        shell: bash
        run: printf 'MISE_DATA_DIR=%s/hnet-mise-%s-%s\n' "$RUNNER_TEMP" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"

      - name: Install project tools
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          version: 2026.9.0
          cache: false

      - name: Install Linux system packages
        if: runner.os == 'Linux'
        run: mise bootstrap --only packages --update --yes

      - name: Run lint
        run: mise run lint

      - name: Scan source and local history
        run: ops/scripts/secret-scan.sh

      - name: Run tests
        shell: bash
        run: |
          find tests -type f -name '*_test.sh' -print0 |
            while IFS= read -r -d '' test_file; do
              "$test_file" || exit "$?"
            done

      - name: Validate collector configurations
        run: ./ops/scripts/validate.sh --collectors

      - name: Validate central Compose configuration
        run: |
          docker compose \
            --env-file ops/telemetry/.env.mac-studio.example \
            -f ops/telemetry/compose.mac-studio.yml \
            config --quiet

      - name: Validate edge Compose configuration
        run: |
          docker compose \
            --env-file ops/telemetry/.env.edge.example \
            -f ops/telemetry/compose.edge.yml \
            config --quiet

  macos-client:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Isolate project tool data
        shell: bash
        run: printf 'MISE_DATA_DIR=%s/hnet-mise-%s-%s\n' "$RUNNER_TEMP" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
      - name: Install project tools
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          version: 2026.9.0
          cache: false
      - name: Validate native client behavior with synthetic credentials
        run: |
          tests/ops/apps/hnetctl/clients_test.sh
          tests/ops/clients/client_test.sh
          tests/ops/clients/zsh/startup_test.sh
          tests/ops/clients/zsh/desktop_launch_test.sh
          tests/ops/clients/release_test.sh
