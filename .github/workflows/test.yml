name: Test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ${{ vars.HNET_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install shell tools
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            brew list shellcheck >/dev/null 2>&1 || brew install shellcheck
          else
            sudo apt-get update
            sudo apt-get install --yes shellcheck zsh
          fi

      - name: Run lint
        run: ./ops/scripts/lint.sh

      - name: Run tests
        run: find tests -type f -name '*_test.sh' -exec {} \;

      - name: Validate central Compose configuration
        run: |
          docker compose \
            --env-file ops/telemetry/.env.mac-studio.example \
            -f ops/telemetry/compose.mac-studio.yml \
            config --quiet

      - name: Validate edge Compose configuration
        run: |
          docker compose \
            --env-file ops/telemetry/.env.edge.example \
            -f ops/telemetry/compose.edge.yml \
            config --quiet
