name: Release preview

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hnet-release-preview
  cancel-in-progress: false

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact requested revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install project tools
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          version: 2026.9.0
          cache: false
      - name: Test, scan, build, and verify preview
        run: mise run release-preview
      - name: Save review artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hnet-release-preview-${{ github.sha }}
          path: |
            dist/hnet-*-darwin-*.tar.gz
            dist/hnet-*-SHA256SUMS
            dist/hnet-*-NOTES.md
          if-no-files-found: error
          retention-days: 7
