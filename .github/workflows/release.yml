name: Release

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: Existing release tag to validate, sign, and publish
        required: true
        type: string

permissions: {}

concurrency:
  group: publish-release-${{ inputs.tag_name }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      revision: ${{ steps.source.outputs.revision }}
      version: ${{ steps.source.outputs.version }}
    steps:
      - name: Validate workflow and tag
        env:
          WORKFLOW_REF: ${{ github.ref }}
          TAG_NAME: ${{ inputs.tag_name }}
        run: |
          test "$WORKFLOW_REF" = "refs/tags/$TAG_NAME"
          pattern='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
          [[ "$TAG_NAME" =~ $pattern ]]
      - name: Checkout release tag
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ inputs.tag_name }}
          fetch-depth: 0
          persist-credentials: false
      - name: Freeze reviewed source
        id: source
        env:
          TAG_NAME: ${{ inputs.tag_name }}
        run: |
          _HNET_RELEASE_SOURCED=true source ops/scripts/release.sh
          revision=$(release_source_revision "$TAG_NAME" "$GITHUB_REF" "$GITHUB_SHA")
          printf 'revision=%s\nversion=%s\n' "$revision" "${TAG_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Isolate project tool data
        run: printf 'MISE_DATA_DIR=%s/hnet-release-mise\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Install project tools
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c
        with:
          version: 2026.9.0
          cache: false
      - name: Install Linux test prerequisites
        run: mise bootstrap --only packages --update --yes
      - name: Check supported-release readiness
        if: ${{ !contains(inputs.tag_name, '-') }}
        run: jq -e '.stable_release_ready == true' ops/clients/homebrew-hnet.json
      - name: Verify stable-release tap credentials
        if: ${{ !contains(inputs.tag_name, '-') }}
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          test -n "$GH_TOKEN"
          gh api repos/yowainwright/homebrew-tap --jq '.permissions.push' | grep -qx true
      - name: Check code
        run: mise run check

  build:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Checkout frozen source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ needs.preflight.outputs.revision }}
          fetch-depth: 0
          persist-credentials: false
      - name: Isolate project tool data
        run: printf 'MISE_DATA_DIR=%s/hnet-release-mise\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Install project tools
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c
        with:
          version: 2026.9.0
          cache: false
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
      - name: Build and verify exact archives
        env:
          TAG_NAME: ${{ inputs.tag_name }}
        run: mise run release-preview -- "$TAG_NAME"
      - name: Sign checksums
        env:
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          checksum="dist/hnet-$RELEASE_VERSION-SHA256SUMS"
          cosign sign-blob --yes --bundle "$checksum.bundle" "$checksum"
      - name: Attest archive provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/hnet-${{ needs.preflight.outputs.version }}-darwin-arm64.tar.gz
            dist/hnet-${{ needs.preflight.outputs.version }}-darwin-amd64.tar.gz
      - name: Upload draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ inputs.tag_name }}
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          gh release create "$TAG_NAME" --verify-tag --draft --latest=false \
            --title "hnet $RELEASE_VERSION" --notes-file "dist/hnet-$RELEASE_VERSION-NOTES.md" \
            "dist/hnet-$RELEASE_VERSION-darwin-arm64.tar.gz" \
            "dist/hnet-$RELEASE_VERSION-darwin-amd64.tar.gz" \
            "dist/hnet-$RELEASE_VERSION-SHA256SUMS" \
            "dist/hnet-$RELEASE_VERSION-SHA256SUMS.bundle"

  publish:
    needs: [preflight, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      attestations: read
    env:
      GH_TOKEN: ${{ github.token }}
      TAG_NAME: ${{ inputs.tag_name }}
      HNET_RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
      RELEASE_REVISION: ${{ needs.preflight.outputs.revision }}
    steps:
      - name: Checkout frozen source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ needs.preflight.outputs.revision }}
          persist-credentials: false
      - name: Isolate project tool data
        run: printf 'MISE_DATA_DIR=%s/hnet-release-mise\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Install project tools
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c
        with:
          version: 2026.9.0
          cache: false
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
      - name: Download and verify draft assets
        run: |
          test "$(gh release view "$TAG_NAME" --json isDraft --jq .isDraft)" = true
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/$TAG_NAME" --jq .sha)" = "$RELEASE_REVISION"
          gh release download "$TAG_NAME" --dir assets --pattern "hnet-$HNET_RELEASE_VERSION-*"
          bash ops/scripts/verify-checksum-signature.sh assets
          bash ops/scripts/verify-release-assets.sh assets
          for archive in assets/hnet-*-darwin-*.tar.gz; do
            gh attestation verify "$archive" --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
              --source-ref "refs/tags/$TAG_NAME" \
              --source-digest "$RELEASE_REVISION" --deny-self-hosted-runners
          done
      - name: Publish verified release
        run: |
          if [[ "$TAG_NAME" == *-* ]]; then
            gh release edit "$TAG_NAME" --draft=false --prerelease --latest=false
          else
            gh release edit "$TAG_NAME" --draft=false --prerelease=false --latest
          fi

  update-homebrew:
    if: ${{ !contains(inputs.tag_name, '-') }}
    needs: publish
    permissions:
      contents: read
    uses: ./.github/workflows/update-homebrew.yml
    with:
      tag_name: ${{ inputs.tag_name }}
    secrets:
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
