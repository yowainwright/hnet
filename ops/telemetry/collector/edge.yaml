extensions:
  file_storage:
    directory: ${env:AGENT_TELEMETRY_QUEUE_DIR}
  health_check:
    endpoint: 0.0.0.0:13133
  bearertokenauth/server:
    tokens:
      - ${env:AGENT_TELEMETRY_INGEST_TOKEN}
  bearertokenauth/client:
    token: ${env:AGENT_TELEMETRY_INGEST_TOKEN}

receivers:
  filelog/zsh:
    include:
      - ${env:AGENT_TELEMETRY_LOG_DIR}/zsh.jsonl
    start_at: end
    storage: file_storage
    operators:
      - type: json_parser
        parse_from: body
        parse_to: attributes
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
        auth:
          authenticator: bearertokenauth/server
      http:
        endpoint: 0.0.0.0:4318
        auth:
          authenticator: bearertokenauth/server

processors:
  memory_limiter:
    check_interval: 5s
    limit_mib: 256
    spike_limit_mib: 64
  resource/host:
    attributes:
      - key: host.name
        action: upsert
        value: ${env:AGENT_TELEMETRY_HOST}
      - key: deployment.environment.name
        action: upsert
        value: personal
  transform/privacy:
    error_mode: propagate
    trace_statements:
      - context: scope
        statements:
          - keep_matching_keys(scope.attributes, "^$")
      - context: resource
        statements:
          - >-
            keep_matching_keys(resource.attributes,
            "^(service\\.name|service\\.namespace|service\\.version|host\\.name|deployment\\.environment\\.name|telemetry\\.sdk\\.(name|language|version)|telemetry\\.pipeline|app\\.version|model|auth_mode|session_source|originator)$")
      - context: span
        statements:
          - set(span.name, "agent.operation")
          - >-
            keep_matching_keys(span.attributes,
            "^(event\\.name|gen_ai\\.(operation\\.name|system|provider\\.name|request\\.model|response\\.model|usage\\.(input|output)_tokens|conversation\\.id)|conversation\\.id|session\\.id|app\\.version|model|auth_mode|session_source|originator|attempt|duration_ms|http\\.response\\.status_code|event\\.kind|(input|output|cached|reasoning|tool)_token_count|prompt_length|tool_name|call_id|decision|success|status|error\\.type)$")
      - context: spanevent
        statements:
          - set(spanevent.name, "agent.event")
          - >-
            keep_matching_keys(spanevent.attributes,
            "^(event\\.name|gen_ai\\.(operation\\.name|system|provider\\.name|request\\.model|response\\.model|usage\\.(input|output)_tokens|conversation\\.id)|conversation\\.id|session\\.id|app\\.version|model|duration_ms|event\\.kind|(input|output|cached|reasoning|tool)_token_count|tool_name|call_id|decision|success|status|error\\.type)$")
    log_statements:
      - context: scope
        statements:
          - keep_matching_keys(scope.attributes, "^$")
      - context: resource
        statements:
          - >-
            keep_matching_keys(resource.attributes,
            "^(service\\.name|service\\.namespace|service\\.version|host\\.name|deployment\\.environment\\.name|telemetry\\.sdk\\.(name|language|version)|telemetry\\.pipeline|app\\.version|model|auth_mode|session_source|originator)$")
      - context: log
        statements:
          - set(body, "")
          - >-
            keep_matching_keys(log.attributes,
            "^(event\\.name|gen_ai\\.(operation\\.name|system|provider\\.name|request\\.model|response\\.model|usage\\.(input|output)_tokens|conversation\\.id|token\\.type)|conversation\\.id|session\\.id|app\\.version|model|auth_mode|session_source|originator|attempt|duration_ms|http\\.response\\.status_code|event\\.kind|(input|output|cached|reasoning|tool)_token_count|prompt_length|tool_name|call_id|decision|success|status|error\\.type|shell\\.command\\.category|shell\\.duration_ms|shell\\.exit_code|shell\\.project)$")
    metric_statements:
      - context: scope
        statements:
          - keep_matching_keys(scope.attributes, "^$")
      - context: resource
        statements:
          - >-
            keep_matching_keys(resource.attributes,
            "^(service\\.name|service\\.namespace|service\\.version|host\\.name|deployment\\.environment\\.name|telemetry\\.sdk\\.(name|language|version)|telemetry\\.pipeline|app\\.version|model|auth_mode|session_source|originator)$")
      - context: datapoint
        statements:
          - >-
            keep_matching_keys(datapoint.attributes,
            "^(gen_ai\\.(operation\\.name|system|provider\\.name|request\\.model|response\\.model|token\\.type)|app\\.version|model|auth_mode|session_source|originator|status|success|kind|tool|token_type|type|error\\.type)$")
exporters:
  otlphttp/central:
    endpoint: ${env:AGENT_TELEMETRY_UPSTREAM}
    auth:
      authenticator: bearertokenauth/client
    sending_queue:
      enabled: true
      storage: file_storage
      queue_size: 10000
      sizer: items
      batch:
        min_size: 512
        flush_timeout: 5s
        sizer: items
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 30s
      max_elapsed_time: 0s

service:
  extensions:
    - file_storage
    - health_check
    - bearertokenauth/server
    - bearertokenauth/client
  pipelines:
    logs:
      receivers:
        - filelog/zsh
        - otlp
      processors:
        - memory_limiter
        - transform/privacy
        - resource/host
      exporters:
        - otlphttp/central
    metrics:
      receivers:
        - otlp
      processors:
        - memory_limiter
        - transform/privacy
        - resource/host
      exporters:
        - otlphttp/central
    traces:
      receivers:
        - otlp
      processors:
        - memory_limiter
        - transform/privacy
        - resource/host
      exporters:
        - otlphttp/central
