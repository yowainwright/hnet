apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "hnet-telemetry.fullname" . }}-clickhouse
  labels:
    {{- include "hnet-telemetry.labels" . | nindent 4 }}
    app.kubernetes.io/component: clickhouse
spec:
  serviceName: clickhouse
  replicas: 1
  selector:
    matchLabels:
      {{- include "hnet-telemetry.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: clickhouse
  template:
    metadata:
      labels:
        {{- include "hnet-telemetry.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: clickhouse
      annotations:
        checksum/config: {{ include "hnet-telemetry.configmaps" . | sha256sum }}
    spec:
      serviceAccountName: {{ include "hnet-telemetry.serviceAccountName" . }}
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 101
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: clickhouse
          image: {{ .Values.images.clickhouse }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          env:
            - name: CLICKHOUSE_DB
              value: otel
            - name: CLICKHOUSE_USER
              value: otel_collector
            - name: CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT
              value: "1"
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "hnet-telemetry.secretName" . }}
                  key: {{ .Values.secret.keys.clickhousePassword }}
            - name: GRAFANA_CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "hnet-telemetry.secretName" . }}
                  key: {{ .Values.secret.keys.grafanaClickhousePassword }}
          ports:
            - name: native
              containerPort: 9000
            - name: http
              containerPort: 8123
          readinessProbe:
            httpGet:
              path: /ping
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /ping
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
          resources: {{- toYaml .Values.clickhouse.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/clickhouse
            - name: backups
              mountPath: /var/lib/clickhouse/backups
            - name: clickhouse-config
              mountPath: /etc/clickhouse-server/config.d/backups.xml
              subPath: backups.xml
              readOnly: true
            - name: clickhouse-config
              mountPath: /etc/clickhouse-server/users.d/telemetry.xml
              subPath: users.xml
              readOnly: true
      volumes:
        - name: clickhouse-config
          configMap:
            name: {{ include "hnet-telemetry.fullname" . }}-clickhouse
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          {{- include "hnet-telemetry.labels" . | nindent 10 }}
          app.kubernetes.io/component: clickhouse
      spec:
        accessModes:
          - ReadWriteOnce
        {{- with .Values.clickhouse.storage.storageClassName }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.clickhouse.storage.dataSize }}
    - metadata:
        name: backups
        labels:
          {{- include "hnet-telemetry.labels" . | nindent 10 }}
          app.kubernetes.io/component: clickhouse
      spec:
        accessModes:
          - ReadWriteOnce
        {{- with .Values.clickhouse.storage.storageClassName }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.clickhouse.storage.backupSize }}
