apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "hnet-telemetry.fullname" . }}-grafana
  labels:
    {{- include "hnet-telemetry.labels" . | nindent 4 }}
    app.kubernetes.io/component: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "hnet-telemetry.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: grafana
  template:
    metadata:
      labels:
        {{- include "hnet-telemetry.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: grafana
      annotations:
        checksum/config: {{ include "hnet-telemetry.configmaps" . | sha256sum }}
    spec:
      serviceAccountName: {{ include "hnet-telemetry.serviceAccountName" . }}
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 472
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: grafana
          image: {{ .Values.images.grafana }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          env:
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "false"
            - name: GF_AUTH_PROXY_ENABLED
              value: "false"
            - name: GF_USERS_ALLOW_SIGN_UP
              value: "false"
            - name: GF_USERS_AUTO_ASSIGN_ORG_ROLE
              value: Viewer
            - name: GF_LOG_MODE
              value: console
            - name: GF_PLUGINS_PREINSTALL_SYNC
              value: grafana-clickhouse-datasource@4.20.0
            - name: GF_SECURITY_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "hnet-telemetry.secretName" . }}
                  key: {{ .Values.secret.keys.grafanaAdminUser }}
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "hnet-telemetry.secretName" . }}
                  key: {{ .Values.secret.keys.grafanaAdminPassword }}
            - name: GRAFANA_CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "hnet-telemetry.secretName" . }}
                  key: {{ .Values.secret.keys.grafanaClickhousePassword }}
          {{- with .Values.grafana.rootUrl }}
            - name: GF_SERVER_ROOT_URL
              value: {{ . | quote }}
          {{- end }}
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
          resources: {{- toYaml .Values.grafana.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/grafana
            - name: tmp
              mountPath: /tmp
            - name: provisioning
              mountPath: /etc/grafana/provisioning/datasources/clickhouse.yaml
              subPath: clickhouse.yaml
              readOnly: true
            - name: provisioning
              mountPath: /etc/grafana/provisioning/dashboards/dashboards.yaml
              subPath: dashboards.yaml
              readOnly: true
            - name: dashboards
              mountPath: /var/lib/grafana/dashboards/agent-telemetry.json
              subPath: agent-telemetry.json
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "hnet-telemetry.fullname" . }}-grafana
        - name: tmp
          emptyDir:
            medium: Memory
        - name: provisioning
          configMap:
            name: {{ include "hnet-telemetry.fullname" . }}-grafana
            items:
              - key: clickhouse.yaml
                path: clickhouse.yaml
              - key: dashboards.yaml
                path: dashboards.yaml
        - name: dashboards
          configMap:
            name: {{ include "hnet-telemetry.fullname" . }}-grafana
            items:
              - key: agent-telemetry.json
                path: agent-telemetry.json
