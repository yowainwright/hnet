apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "hnet-telemetry.fullname" . }}-grafana
  labels:
    {{- include "hnet-telemetry.labels" . | nindent 4 }}
    app.kubernetes.io/component: grafana
spec:
  accessModes:
    - ReadWriteOnce
  {{- with .Values.grafana.storage.storageClassName }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.grafana.storage.size }}
