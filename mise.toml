min_version = "2026.9.0"

# CLI versions match the locally validated toolchain.
[tools]
"aqua:1password/cli" = "v2.39.0"
gh = "2.99.0"
"github:gitleaks/gitleaks" = "8.30.1"
helm = "4.2.4"
jq = "1.7.1"
k9s = "0.51.0"
kubectl = "1.33.9"
mprocs = "0.9.6"
restic = "0.19.1"
shellcheck = "0.11.0"
shfmt = "3.14.0"
"github:yowainwright/fs-lint" = "0.3.0"
"github:yowainwright/src-lint" = "0.2.0"
"github:yowainwright/struct-lint" = "0.1.0"

# OrbStack supplies Docker, Compose, and orbctl on the supported Mac hosts.
# Linux CI runners supply Docker and Compose; zsh is their extra OS package.
# Bash, curl, Git, tar, and the standard Unix utilities are host prerequisites.
[bootstrap.packages]
"apt:zsh" = { version = "latest", os = "linux" }
"brew-cask:orbstack" = { version = "latest", os = "macos", adopt = true }
"brew-cask:tailscale-app" = { version = "latest", os = "macos", adopt = true }

[tasks.lint]
description = "Check shell syntax, formatting, paths, imports, and declaration order"
run = ["./ops/scripts/lint.sh --strict", "./ops/scripts/lint-structure.sh"]

[tasks."lint:structure"]
description = "Check repository paths and supported source structure"
run = "./ops/scripts/lint-structure.sh"

[tasks.security]
description = "Scan local history and publication inputs"
run = "./ops/scripts/secret-scan.sh"

[tasks.test-release]
description = "Test release selection, guards, packaging, and lifecycle"
run = ["tests/ops/scripts/release_test.sh", "tests/ops/clients/release_test.sh"]

[tasks.check]
description = "Run local release code checks"
run = ["mise run lint", "mise run test-release", "mise run security"]

[tasks.release-preview]
description = "Build and verify release archives without publishing"
run = "bash ops/scripts/release.sh --preview"

[tasks.release-verify]
description = "Verify release archives and their checksums"
run = "bash ops/scripts/verify-release-assets.sh"

[tasks.release-dry-run]
description = "Select a version and validate a release without tagging or publishing"
run = "bash ops/scripts/release.sh --dry-run"

[tasks.release]
description = "Select, validate, confirm, and dispatch a release"
run = "bash ops/scripts/release.sh"

[tasks."release:patch"]
description = "Publish the next patch version"
run = "bash ops/scripts/release.sh --patch"

[tasks."release:patch:dry-run"]
description = "Validate the next patch release without publishing"
run = "bash ops/scripts/release.sh --patch --dry-run"

[tasks."release:minor"]
description = "Publish the next minor version"
run = "bash ops/scripts/release.sh --minor"

[tasks."release:minor:dry-run"]
description = "Validate the next minor release without publishing"
run = "bash ops/scripts/release.sh --minor --dry-run"

[tasks."release:major"]
description = "Publish the next major version"
run = "bash ops/scripts/release.sh --major"

[tasks."release:major:dry-run"]
description = "Validate the next major release without publishing"
run = "bash ops/scripts/release.sh --major --dry-run"
